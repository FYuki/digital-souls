# #150の障害注入専用。通常dev・dogfoodとは別projectで起動する。
services:
  livekit:
    image: livekit/livekit-server:v1.9.7
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?LIVEKIT_KEYS is required}
    labels:
      io.digital-souls.purpose: voice-quality-fault-injection
      io.digital-souls.environment: test
    ports:
      - "127.0.0.1:19880:19880/tcp"
      - "127.0.0.1:19881:19881/tcp"
      - "127.0.0.1:19882:19882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - fault
networks:
  fault:
    driver: bridge
    labels:
      io.digital-souls.purpose: voice-quality-fault-injection
