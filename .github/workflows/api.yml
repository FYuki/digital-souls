name: API checks

on:
  pull_request:
  push:
    branches: [main, 'epic/**']

permissions:
  contents: read

jobs:
  api-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: core/.python-version
      - name: Install locked toolchain
        run: |
          python -m pip install uv==0.8.22
          uv lock --check
          uv sync --frozen
      - name: Lint, format and type contracts
        run: |
          bash -n tools/start-llamacpp.sh
          bash -n tools/test-postgres.sh
          bash -n tools/with-test-postgres.sh
          bash -n tools/evaluate-semantic-retrieval.sh
          bash -n tools/evaluate-semantic-answer.sh
          uv run --no-sync ruff check src tests tools/evaluate-semantic-retrieval.py tools/prepare-semantic-tuning-supplements.py tools/evaluate-semantic-embedding-candidates.py evals/semantic/provider.py tools/evaluate-persona-consistency.py tools/evaluate-injection-resistance.py tools/evaluate-privacy-classifier.py
          uv run --no-sync ruff format --check src tests tools/evaluate-semantic-retrieval.py tools/prepare-semantic-tuning-supplements.py tools/evaluate-semantic-embedding-candidates.py evals/semantic/provider.py tools/evaluate-persona-consistency.py tools/evaluate-injection-resistance.py tools/evaluate-privacy-classifier.py
          uv run --no-sync mypy
      - name: Required unit tests (no network)
        run: uv run --no-sync pytest -m ut -q
      - name: Required integration tests (no network)
        run: uv run --no-sync pytest -m it1 -q
      - name: Build and install locked package
        run: |
          uv build --no-build-isolation
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/core-runtime.txt
          uv venv .package-check
          uv pip install --python .package-check/bin/python --require-hashes -r /tmp/core-runtime.txt
          uv pip install --python .package-check/bin/python --no-deps dist/*.whl
          .package-check/bin/python -I -c "from digital_souls_core.api import create_app; assert create_app().title == 'Digital Souls Core'"

  postgres-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: core/.python-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install locked toolchain
        run: |
          python -m pip install uv==0.8.22
          uv lock --check
          uv sync --frozen
      - name: Validate local PostgreSQL Compose syntax
        run: docker compose -f compose.postgresql.json config --no-interpolate --quiet
      - name: Required isolated PostgreSQL storage and semantic evaluation contracts
        run: bash tools/test-postgres.sh
      - name: Install locked promptfoo evaluation dependency
        working-directory: core/evals/semantic
        run: npm ci --no-audit --no-fund
      - name: Required answer assertions and report gate contracts
        run: node --test --test-reporter=../tools/required-tests-reporter.mjs tools/semantic-answer.test.mjs
      - name: Required uncached answer fixture evaluation (62 cases, 3 runs)
        run: bash tools/evaluate-semantic-answer.sh --runs 3 --output "$RUNNER_TEMP/semantic-answer-report.json"
