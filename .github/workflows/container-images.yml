name: Container images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'epic/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
          - name: whisper
            dockerfile: whisper_service/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - id: registry
        name: Resolve lowercase GHCR namespace
        shell: bash
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          printf 'prefix=ghcr.io/%s\n' "$owner" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.registry.outputs.prefix }}/digital-souls-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record immutable image
        run: |
          printf '### %s\n\n`%s/digital-souls-%s@%s`\n' \
            '${{ matrix.name }}' '${{ steps.registry.outputs.prefix }}' \
            '${{ matrix.name }}' '${{ steps.build.outputs.digest }}' \
            >> "$GITHUB_STEP_SUMMARY"
