[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "digital-souls-core"
version = "0.1.0"
description = "Provider-independent character core with conversation history, memory, and a bounded Chat Completions API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anyio==4.15.1",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "litellm==1.103.2",
  "openai==2.54.0",
  "pydantic==2.11.9",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "pytest-socket==0.7.0",
  "ruff==0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/digital_souls_core"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools/evaluate-semantic-retrieval.py", "tools/prepare-semantic-tuning-supplements.py", "tools/evaluate-semantic-embedding-candidates.py", "evals/semantic/provider.py", "tools/evaluate-persona-consistency.py", "tools/evaluate-injection-resistance.py", "tools/evaluate-privacy-classifier.py"]

[[tool.mypy.overrides]]
module = ["litellm.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --disable-socket --allow-unix-socket"
markers = ["ut: isolated unit contracts", "it1: in-process integration with fake transport", "postgres: isolated PostgreSQL storage contracts with synthetic data"]
