description: Production semantic privacy classifier conformance
prompts:
  - "{{text}}"
providers:
  - id: file://provider.py
defaultTest:
  assert:
    - type: is-json
    - type: javascript
      value: |
        (() => {
          const result = JSON.parse(output);
          return context.vars.allowed_classifications.includes(result.classification)
            && (result.classification === 'ABSTAIN'
              || result.subject_scope === context.vars.expected_subject_scope);
        })()
tests: cases.jsonl
