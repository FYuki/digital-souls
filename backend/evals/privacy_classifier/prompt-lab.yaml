description: Semantic privacy prompt lab
prompts:
  - |
      Semantic privacy classifier prompt candidate v1.
      Return only JSON with classification, subject_scope, category, and reason_code.
      Text: {{text}}
providers:
  - id: ollama:chat:gemma4:e4b
    config:
      format: json
defaultTest:
  assert:
    - type: is-json
    - type: javascript
      value: |
        (() => {
          const result = JSON.parse(output);
          return context.vars.allowed_classifications.includes(result.classification)
            && (result.classification === 'ABSTAIN'
              || result.subject_scope === context.vars.expected_subject_scope);
        })()
tests: cases.jsonl
