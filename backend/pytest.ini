[pytest]
testpaths = tests/unit tests/module
pythonpath = .
markers =
    rag_retrieval_real: 実Chromaと実Ollama embeddingを使うopt-in RAG検索評価
    inference_real: Inference Providerへ実接続する明示実行専用の受入テスト
    semantic_digest_http: 合成HTTPでSemantic model digest解決を検証するmoduleテスト
    episodic_model_output: 合成HTTPでEpisode構造化出力を検証するmoduleテスト
    cross_language: Git履歴またはFrontendのNode依存を使う契約・証跡テスト
